name: Build Songyot OS ISO

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debootstrap \
          squashfs-tools \
          xorriso \
          isolinux \
          syslinux-utils \
          grub-pc-bin \
          grub-efi-amd64-bin

    - name: Run build environment test
      run: |
        chmod +x scripts/test-build-env.sh
        sudo bash scripts/test-build-env.sh

    - name: Build ISO
      run: |
        cd build
        chmod +x build-iso.sh
        sudo ./build-iso.sh

    - name: Calculate checksum
      run: |
        cd dist
        sha256sum songyot-os-*.iso > songyot-os-1.0-amd64.iso.sha256
        cat songyot-os-1.0-amd64.iso.sha256

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v3
      with:
        name: songyot-os-iso
        path: |
          dist/*.iso
          dist/*.sha256
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.iso
          dist/*.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
